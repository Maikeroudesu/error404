<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>503 – Service Unavailable</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #04050d;
      color: #eef2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 540px;
    }

    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 15%, #fde047 50%, #f97316 88%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>

  <main>
    <div class="code">503</div>
    <h1>503 – Service Unavailable</h1>
    <p>Autonomous droid Unit-734 is currently repairing core circuits and recalibrating the subspace relay. Service will resume shortly.</p>
  </main>

  <script>
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");
    let width, height, stars = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      stars = Array.from({ length: 220 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random(),
        s: (Math.random() - 0.5) * 0.02
      }));
    }

    function animate() {
      ctx.fillStyle = "#04050d";
      ctx.fillRect(0, 0, width, height);

      for (const star of stars) {
        star.a += star.s;
        if (star.a <= 0.1 || star.a >= 1) star.s *= -1;
        ctx.fillStyle = `rgba(255, 255, 255, ${star.a})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    animate();
  </script>
</body>
</html>
